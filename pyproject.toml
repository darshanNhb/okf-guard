[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okf-guard"
version = "0.1.0"
description = "A content-safety scanning layer for OKF (Open Knowledge Format) generation pipelines, detecting hidden content and prompt-injection patterns before they enter a trusted knowledge bundle."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "OKF Guard Team" }
]
keywords = ["okf", "open-knowledge-format", "prompt-injection", "ai-security", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=0.6.23"]
xlsx = ["openpyxl>=3.1"]
html = ["beautifulsoup4>=4.12", "lxml>=5.0"]
all = ["okf-guard[pdf,docx,pptx,xlsx,html]"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
okfguard = "okfguard.cli:main"

[project.urls]
Homepage = "https://github.com/okf-guard-team/okf-guard"
Repository = "https://github.com/okf-guard-team/okf-guard"

[tool.hatch.build.targets.wheel]
packages = ["src/okfguard"]
